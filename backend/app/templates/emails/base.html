<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background-color: #f0f9ff; margin: 0; padding: 40px 20px;">
    <div style="max-width: 480px; margin: 0 auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        
        <!-- Header -->
        <div style="background: #059669; padding: 40px 20px; text-align: center;">
            <div style="width: 60px; height: 60px; background: white; border-radius: 8px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 32px; font-weight: bold; color: #059669;">R</span>
            </div>
            <h1 style="color: white; margin: 0; font-size: 24px; font-weight: 600;">Recruit AI</h1>
            <p style="color: #a7f3d0; margin: 8px 0 0; font-size: 14px;">Resume Screening System</p>
        </div>

        {% block content %}{% endblock %}

        <!-- Email Footer -->
        <div style="background: #f9fafb; padding: 24px; text-align: center; border-top: 1px solid #e5e7eb;">
            <p style="margin: 8px 0 0; font-size: 11px; color: #9ca3af;">
                © 2026 Recruit AI. All rights reserved.
            </p>
        </div>

    </div>
</body>
</html>
