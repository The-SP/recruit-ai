# Pre-TLS HTTP config. certbot rewrites this file in place to add the
# HTTPS (443) server block and an HTTP->HTTPS redirect. Do NOT overwrite
# this file on the server after certbot has run, or you will drop the
# TLS config. Re-run certbot instead if you need to regenerate it.
server {
    listen 80;
    server_name api.recruitai.qzz.io;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
