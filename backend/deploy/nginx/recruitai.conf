# Pre-TLS HTTP config. certbot rewrites this file in place to add the
# HTTPS (443) server block and an HTTP->HTTPS redirect. Do NOT overwrite
# this file on the server after certbot has run, or you will drop the
# TLS config. Re-run certbot instead if you need to regenerate it.
server {
    listen 80;
    server_name api.recruitai.qzz.io;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE responses (POST /interviews/{token}/answers) must reach the
    # client incrementally. nginx buffers proxied responses by default,
    # which would hold every frame until the stream closed.
    location /interviews/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        # Spoken answers (POST /interviews/{token}/answers-audio) upload as
        # multipart audio. MAX_ANSWER_AUDIO_BYTES in
        # app/interview/constants.py is 15 MB; nginx's 1 MB default would
        # 413 every recording before FastAPI ever saw it.
        client_max_body_size 16m;
    }
}
