services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.prod
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env.prod
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  uploads_data: