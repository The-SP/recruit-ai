services:
  # One-shot migration runner, invoked explicitly by deploy.sh via
  # `run --rm migrate`. Kept out of the default profile so `up --wait` does not
  # treat its (expected) exit as a service that failed to stay running.
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env.prod
    restart: "no"
    profiles: ["tools"]

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.prod
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health', timeout=3).status_code == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env.prod
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  uploads_data:
