[project]
name = "recruit-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "celery[redis]>=5.6.0",
    "fastapi>=0.125.0",
    "jinja2>=3.1.6",
    "langchain>=1.0.5",
    "langchain-google-genai>=3.0.2",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.4",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "redis>=6.4.0",
    "resend>=2.19.0",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.23.0",
    "flower>=2.0.1",
    "ipykernel>=7.1.0",
    "mypy>=1.20.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.0",
    "ruff>=0.14.6",
]

[tool.mypy]
strict = true
exclude = "alembic/"

[tool.ruff]
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "I",  # isort
]
