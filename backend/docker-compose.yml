services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruit-ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruit-ai
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruit-ai
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  uploads_data:
