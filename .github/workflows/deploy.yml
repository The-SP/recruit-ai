name: Deploy to EC2

# Manual-only: this workflow never runs on push/PR. Trigger it from the
# Actions tab ("Run workflow") or via `gh workflow run deploy.yml`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch/tag the host should deploy"
        required: false
        default: main

permissions:
  id-token: write # required for AWS OIDC
  contents: read

# Never let two production deploys overlap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-09f5974c17c5142dd
  DEPLOY_PATH: /home/ssm-user/r.ai/backend
  HEALTH_URL: https://api.recruitai.qzz.io/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # Update the host checkout to the requested ref before invoking
          # deploy.sh. Performing the git update here, rather than inside the
          # script, ensures that changes to deploy.sh take effect on the same
          # deploy that introduces them; otherwise the previous deploy's copy of
          # the script would run and pick up the change only on the next deploy.
          #
          # The command is assembled as a single %q-quoted argument to `bash -c`
          # and executed as ssm-user (SSM runs commands as root by default).
          REF_Q=$(printf '%q' "${DEPLOY_REF}")
          REMOTE_SCRIPT="set -euo pipefail && cd ${DEPLOY_PATH} && git fetch --all --prune && git checkout ${REF_Q} && git pull --ff-only origin ${REF_Q} && exec ${DEPLOY_PATH}/deploy/deploy.sh ${REF_Q}"
          REMOTE="sudo -iu ssm-user bash -c $(printf '%q' "${REMOTE_SCRIPT}")"

          # Pass the command as JSON via jq so quoting survives intact.
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')

          echo "Dispatching SSM command to ${INSTANCE_ID} (ref: ${DEPLOY_REF})..."
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy (${DEPLOY_REF})" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)
          echo "CommandId: ${CMD_ID}"

          # send-command is async — poll the invocation to real completion.
          echo "Waiting for command to finish..."
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac
            sleep 10
          done

          echo "----- Remote stdout -----"
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" --output text || true
          echo "----- Remote stderr -----"
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardErrorContent" --output text || true

          echo "Final status: ${STATUS}"
          if [ "${STATUS}" != "Success" ]; then
            echo "::error::Deploy command ended with status ${STATUS}"
            exit 1
          fi

      - name: Health check
        run: |
          set -euo pipefail
          echo "Probing ${HEALTH_URL}..."
          for i in $(seq 1 5); do
            if curl -fsS "${HEALTH_URL}"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after retries"
          exit 1
